<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f3" />
    <meta
      name="description"
      content="The thinking behind HSBC Atlas: making banking a relationship again. A twelve-slide concept story."
    />
    <title>Making banking a relationship again · HSBC Atlas</title>
    <link rel="icon" href="/app-icon.svg" />
  </head>
  <body>
    <header class="deck-header">
      <a
        class="deck-brand"
        href="/?p=sam&tab=now&theme=vanilla"
        data-demo
        aria-label="HSBC Atlas prototype"
        ><svg viewBox="0 0 60 30" aria-hidden="true">
          <path fill="#db0011" d="M0 15 15 0h30l15 15-15 15H15Z" />
          <path fill="white" d="m15 0 15 15L45 0v30L30 15 15 30Z" /></svg
        ><b>HSBC</b><span>Atlas</span></a
      ><a class="prototype-link" href="/?p=sam&tab=now&theme=vanilla" data-demo
        >Open prototype <span data-icon="arrow_forward"></span
      ></a>
    </header>
    <main id="deck" aria-label="Atlas concept presentation"></main>
    <footer class="deck-controls">
      <button id="contents" aria-label="Choose a slide">
        <span data-icon="grid_view"></span><span id="counter">01 / 12</span>
      </button>
      <div class="deck-progress" aria-hidden="true"><span></span></div>
      <button id="previous" aria-label="Previous slide"><span data-icon="arrow_back"></span></button
      ><button id="next" aria-label="Next slide"><span data-icon="arrow_forward"></span></button>
    </footer>
    <div id="scroll-cue" hidden aria-hidden="true">
      Scroll for more <span data-icon="arrow_downward"></span>
    </div>
    <dialog id="slide-menu" aria-labelledby="menu-title">
      <header>
        <h2 id="menu-title">The story</h2>
        <button id="menu-close" aria-label="Close slide menu">
          <span data-icon="close"></span>
        </button>
      </header>
      <nav aria-label="Slides"></nav>
    </dialog>
    <script type="module" src="/src/presentation/deck.ts"></script>
  </body>
</html>
